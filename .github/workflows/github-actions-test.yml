name: GitHub Actions Demo

run-name: ${{ github.actor }} is testing out GitHub Actions

on: [push]

jobs:

  set-environment:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install openmpi-bin libopenmpi-dev libnetcdf-mpi-dev netcdf-bin
      - run: dpkg -L libnetcdf-mpi-dev

  compile-run-mpi:
    needs: set-environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Run the mpi_no_netcdf code
        run: |
          cd mpi_no_netcdf
          make
          mpiexec -np 2 ./run/ufsLand.exe

  compile-run-netcdf:
    needs: set-environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Run the netcdf code
        run: |
          cd netcdf
          make
          ./test_netcdf.exe
          ncdump blah.nc

  compile-run-mpi-netcdf:
    needs: set-environment
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Run the mpi_netcdf code
        run: |
          cd mpi_netcdf
          make
          mpiexec -np 2 ./run/ufsLand.exe
          ls
          ls run
          ncdump ./run/test.nc
    
